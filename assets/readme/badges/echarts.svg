<svg xmlns="http://www.w3.org/2000/svg" width="138" height="20" viewBox="0 0 138 20" role="img" aria-label="ECharts: Visualization">
  <title>ECharts: Visualization</title>
  <defs>
    <linearGradient id="shine" x2="0" y2="100%"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-opacity=".08"/></linearGradient>
    <clipPath id="rounded"><rect width="138" height="20" rx="3"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="54" height="20" fill="#555"/>
    <rect x="54" width="84" height="20" fill="#aa344d"/>
    <rect width="138" height="20" fill="url(#shine)"/>
  </g>
  <g font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle">
    <text x="27" y="15" fill="#010101" fill-opacity=".3">ECharts</text>
    <text x="27" y="14" fill="#fff">ECharts</text>
    <text x="96" y="15" fill="#010101" fill-opacity=".3">Visualization</text>
    <text x="96" y="14" fill="#fff">Visualization</text>
